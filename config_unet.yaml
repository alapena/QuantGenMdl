device: 'cuda:0' # 'cpu', 'cuda:0', 'cuda:1'
seed: 0
model:
  # name: 'MSQDDPM' # 'QDDPM', 'MSQDDPM'
  n_timesteps: 40 # Number of time steps T
  'diffusion_schedule': 
    'name': 'linear'
    'slope': 1.3
  # n_backward_layers: 8 # L
  # n_ancilla_qubits: 2 # na
  # n_zero_ancilla_qubits: 1
  # n_haar_ancilla_qubits: 1 # Currently only supported for 1 or 0. n_tot = n + n_haar_ancilla_qubits + n_ancilla_qubits (zero).
  # unet_config:
  #   in_channels: 2
  #   out_channels: 2
  #   layers_per_block: 2
  #   block_out_channels: [64, 128]
  #   down_block_types: [
  #     "DownBlock1D",
  #     "AttnDownBlock1D",
  #   ]
  #   up_block_types: [
  #     "AttnUpBlock1D",
  #     "UpBlock1D",
  #   ]
  #   mid_block_type: "UNetMidBlock1D"
  #   out_block_type : null
  #   act_fn: 'silu'
  #   norm_num_groups: 8
training:
  overwrite_saves: False
  batch_size: 200 # If null, it will be set to the size of the training dataset
  n_epochs: 5000
  learning_rate: 0.00001 # 1e-5
  lr_scheduler: 
    type: 'sequential_2cosine' # 'CosineAnnealingWarmRestarts', 'ctt',
    sched1:
      T_max: 200
      eta_min: 0.000001 # 1e-6
    sched2:
      T_max: 200
      eta_min: 0.00000001 # 1e-8
    # patience: 50
    # min_lr: 0.00000000000000000001 # 1e-20
    # T_0: 100
    # T_mult: 2
    # start_factor: 1
    # end_factor: 0.00001
    # total_iters: 1000
  optimizer:
    type: 'SOAP' # 'Adam', 'SGD', 'SOAP'
  regularization: 0.03
  # live_plot:
  #   save: True
  #   frequency: 50
  loss_fn: 'quantum_mean_infidelity' # 'sinkhorn', 'wass', 'mmd', 'mse', 'mse_and_norm', 'quantum_infidelity'
  # loss_fn_kwargs:
    # reduction: 'sum' # 'mean', 'sum', 'none'
    # lambd: 0.1
dataset:
  dir: 'results_UNet' # Directory to store the dataset
  name: 'MNIST_1' # e.g. 'MNIST_0', 'CIRCLEY_3'
  transforms:
    resize: 16 # nxn pixels to resize.
  maxsize: 1000
  

  
