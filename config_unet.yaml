device: 'cuda:0' # 'cpu', 'cuda:0', 'cuda:1'
seed: 0
model:
  # name: 'MSQDDPM' # 'QDDPM', 'MSQDDPM'
  n_timesteps: 6 # Number of time steps T
  diffusion_schedule:
    name: 'linear' # 'linear', 'square'
    # slope: 0.2
  # n_backward_layers: 8 # L
  # n_ancilla_qubits: 2 # na
  # n_zero_ancilla_qubits: 1
  # n_haar_ancilla_qubits: 1 # Currently only supported for 1 or 0. n_tot = n + n_haar_ancilla_qubits + n_ancilla_qubits (zero).
training:
  overwrite_saves: False
  batch_size: null # If null, it will be set to the size of the training dataset
  n_epochs: 2001 # Epochs for training each time step
  learning_rate: 0.005
  lr_scheduler: 
    type: 'CosineAnnealingWarmRestarts' # 'CosineAnnealingWarmRestarts', 'ctt',
    T_0: 100
    T_mult: 3
  regularization: 0.03
  live_plot:
    save: True
    frequency: 50
  loss_fn: 'mmd' # 'sinkhorn', 'wass', 'mmd'
dataset:
  dir: 'results_UNet' # Directory to store the dataset
  name: 'CIRCLEY_1' # e.g. 'MNIST_0', 'CIRCLEY_3'
  # transforms:
  #   resize: 16 # nxn pixels to resize.
  maxsize: 300
unet_config:
  in_channels: 1
  out_cnahhels: 1
  layers_per_block: 2
  block_out_channels: [8, 8, 16, 16, 32, 32]
  down_block_types: [
    "DownBlock1D",
    "DownBlock1D",
    "DownBlock1D",
    "DownBlock1D",
    "AttnDownBlock1D",
    "DownBlock1D",
  ]
  up_block_types: [
    "UpBlock1D",
    "AttnUpBlock1D",
    "UpBlock1D",
    "UpBlock1D",
    "UpBlock1D",
    "UpBlock1D",
  ]
  middle_block_type: "UNetMidBlock1D"
  out_block_type : null
  act_fn: 'silu'
  norm_num_groups: 8
  

  
