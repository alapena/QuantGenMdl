device: 'cuda:0' # 'cpu', 'cuda:0', 'cuda:1'
seed: 0
model:
  # name: 'MSQDDPM' # 'QDDPM', 'MSQDDPM'
  n_timesteps: 20 # Number of time steps T
  'diffusion_schedule': 
    'name': 'linear'
    'slope': 1.3
  # n_backward_layers: 8 # L
  # n_ancilla_qubits: 2 # na
  # n_zero_ancilla_qubits: 1
  # n_haar_ancilla_qubits: 1 # Currently only supported for 1 or 0. n_tot = n + n_haar_ancilla_qubits + n_ancilla_qubits (zero).
  unet_config:
    in_channels: 2
    out_channels: 2
    layers_per_block: 2
    block_out_channels: [64, 128]
    down_block_types: [
      "DownBlock1D",
      "AttnDownBlock1D",
    ]
    up_block_types: [
      "AttnUpBlock1D",
      "UpBlock1D"
    ]
    mid_block_type: "UNetMidBlock1D"
    out_block_type : null
    act_fn: 'silu'
    norm_num_groups: 8
training:
  overwrite_saves: False
  batch_size: null # If null, it will be set to the size of the training dataset
  n_epochs: 5000
  learning_rate: 0.005
  lr_scheduler: 
    type: 'OneCycleLR' # 'CosineAnnealingWarmRestarts', 'ctt',
    anneal_strategy: linear
  regularization: 0.03
  # live_plot:
  #   save: True
  #   frequency: 50
  loss_fn: 'mse' # 'sinkhorn', 'wass', 'mmd', 'mse'
dataset:
  dir: 'results_UNet' # Directory to store the dataset
  name: 'MNIST_1' # e.g. 'MNIST_0', 'CIRCLEY_3'
  transforms:
    resize: 16 # nxn pixels to resize.
  maxsize: 1000
  

  
