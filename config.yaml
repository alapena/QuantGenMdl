device: 'cuda:1' # 'cpu', 'cuda:0', 'cuda:1'
model:
  n_timesteps: 20 # Number of time steps T
  max_diffusion_weight: 4.0 # Maximum value of the diffusion weight (diff_hs in the repo code, where 4.0 is default)
  diffusion_schedule: 'quadratic' # 'linear', 'quadratic'
  n_backward_layers: 6 # L
  n_ancilla_qubits: 3 # na
  seed: 0 # The seed for the HaarSampleGeneration
training:
  batch_size: null # If null, it will be set to the size of the training dataset
  n_epochs: 5001 # Epochs for training each time step
  learning_rate: 0.0005
  regularization: 0.03
dataset:
  dir: 'data' # Directory to store the dataset
  name: 'MNIST0' # 'MNIST', 'MNIST0'
  maxsize: 1000
  transforms:
    resize: 8 # nxn pixels to resize.